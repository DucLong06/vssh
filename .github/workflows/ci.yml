name: CI

on:
  push:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Stable, unless a rust-toolchain.toml is added: rustup gives that file priority.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo build --release
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
      # vssh-core stays free of TUI crates: the desktop app builds on it too.
      - run: ./scripts/check-core-deps.sh

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Also caches ~/.cargo/bin, so cargo-audit is only compiled once.
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --locked
      # Ignored advisories, with reasons, are in .cargo/audit.toml.
      - run: cargo audit
