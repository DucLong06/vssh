name: desktop-release
# The desktop app for Linux (AppImage, .deb, .rpm) and for Windows (an NSIS
# setup.exe, a portable zip) on a v0.2.* tag. Nothing is published before the
# .deb has been installed in a bare ubuntu:22.04 and its window has shown the
# app (scripts/deb-smoke.sh), nor before the Windows build has passed its
# tests and answered its version: one release, with both or with neither.
#
# The version is the tag's: it is merged over tauri.conf.json at build time,
# the way release.yml takes the terminal app's from the tag, so no commit has
# to bump Cargo.toml first. The same merge names the bundle vssh-desktop
# (the terminal app's package is already called vssh), drops devUrl, and
# has the .deb depend on wget: the app's own update fetches the next one with it.
on:
  push:
    tags: ["v0.2.*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.config.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Release config, from the tag
        id: config
        run: |
          ver=${GITHUB_REF_NAME#v}
          echo "$ver" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::tag $GITHUB_REF_NAME is not vX.Y.Z"; exit 1; }
          # Merged over tauri.conf.json (RFC 7396: null takes a key out).
          cat > "$RUNNER_TEMP/release.conf.json" <<JSON
          {
            "version": "$ver",
            "productName": "vssh-desktop",
            "build": { "devUrl": null, "beforeDevCommand": null },
            "bundle": {
              "publisher": "Hoang Duc Long <hoangduclongg@gmail.com>",
              "category": "Utility",
              "shortDescription": "Desktop SSH connection manager",
              "longDescription": "Host dashboard with live stats, terminal tabs with broadcast typing, SFTP dual-pane, snippets, batch runs, port forwards and an encrypted vault. The desktop frontend of vssh, on the same core as the terminal app.",
              "linux": { "deb": { "depends": ["wget"] } }
            }
          }
          JSON
          echo "version=$ver" >> "$GITHUB_OUTPUT"
      - name: Libraries tauri builds against
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/vssh-desktop/package-lock.json
      # The tauri CLI is a dev dependency; beforeBuildCommand (npm run build) needs the rest.
      - run: npm ci
        working-directory: crates/vssh-desktop
      # No tagName, no releaseId: it only builds. The release is the last job's.
      - uses: tauri-apps/tauri-action@v1
        with:
          projectPath: crates/vssh-desktop
          args: --bundles deb,rpm,appimage --config ${{ runner.temp }}/release.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          if-no-files-found: error
          # Kept under their common parent: deb/, rpm/, appimage/.
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage

  smoke:
    needs: build
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: desktop-linux
          path: dist
      - name: Install the .deb in a bare ubuntu:22.04, ask its version, look at its window
        run: |
          docker run --rm -e VSSH_DEB_INSTALL=1 -v "$PWD:/w" -w /w ubuntu:22.04 \
            sh scripts/deb-smoke.sh "dist/deb/vssh-desktop_${VERSION}_amd64.deb" "$VERSION" dist/deb-smoke.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deb-smoke-screenshot
          path: dist/deb-smoke.png

  # No window is looked at here: the runner has no desktop to show one on.
  # The tests, the bundle and the app's answer to --version are the gate.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Release config, from the tag
        run: |
          ver=${GITHUB_REF_NAME#v}
          echo "$ver" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::tag $GITHUB_REF_NAME is not vX.Y.Z"; exit 1; }
          echo "VERSION=$ver" >> "$GITHUB_ENV"
          # The same merge as the Linux build's, without what only a .deb reads.
          cat > release.conf.json <<JSON
          {
            "version": "$ver",
            "productName": "vssh-desktop",
            "build": { "devUrl": null, "beforeDevCommand": null },
            "bundle": {
              "publisher": "Hoang Duc Long",
              "shortDescription": "Desktop SSH connection manager"
            }
          }
          JSON
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/vssh-desktop/package-lock.json
      - run: npm ci
        working-directory: crates/vssh-desktop
      # The desktop app's tests compile the built frontend in.
      - run: npm run build
        working-directory: crates/vssh-desktop
      - run: cargo test --workspace
      - name: The installer
        run: npm run tauri -- build --bundles nsis --config "$GITHUB_WORKSPACE/release.conf.json"
        working-directory: crates/vssh-desktop
      - name: The app answers its version
        run: |
          said=$(target/release/vssh-desktop.exe --version | tr -d '\r')
          [ "$said" = "vssh-desktop $VERSION" ] || { echo "::error::--version said '$said', not 'vssh-desktop $VERSION'"; exit 1; }
      - name: Portable zip, the app alone
        shell: pwsh
        run: Compress-Archive -Path target/release/vssh-desktop.exe -DestinationPath "vssh-desktop_${env:VERSION}_x64-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          if-no-files-found: error
          path: |
            target/release/bundle/nsis/*-setup.exe
            vssh-desktop_*_x64-portable.zip

  publish:
    needs: [build, smoke, windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: desktop-linux
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: desktop-windows
          path: dist/windows
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/deb/*.deb
            dist/rpm/*.rpm
            dist/appimage/*.AppImage
            dist/windows/**/*-setup.exe
            dist/windows/*-portable.zip
