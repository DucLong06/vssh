[package]
name = "vssh"
version = "0.1.0"
edition = "2021"
description = "TUI SSH connection manager"
license = "MIT"

[dependencies]
anyhow = "1"
argon2 = "0.6"
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
fuzzy-matcher = "0.3"
ratatui = "0.30"
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3"
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "fs"] }
toml = "0.9"
vt100 = "0.18"
zeroize = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
