[workspace]
members = ["crates/vssh-core", "crates/vssh-tui", "crates/vssh-desktop/src-tauri"]
# The desktop app needs the system's webview libraries; a plain `cargo build`
# (CI, install.sh) builds the terminal app only. `--workspace` builds both.
default-members = ["crates/vssh-core", "crates/vssh-tui"]
resolver = "2"

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT"

[workspace.dependencies]
vssh-core = { path = "crates/vssh-core", version = "0.1.2" }
anyhow = "1"
argon2 = "0.6"
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
fuzzy-matcher = "0.3"
ratatui = "0.30"
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "fs"] }
toml = "0.9"
vt100 = "0.18"
zeroize = "1"

# The TUI owns the terminal: nothing may print to it, and nothing may log secrets.
[workspace.lints.clippy]
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"

# Argon2 is slow on purpose; unoptimized it dominates the test run.
[profile.dev.package.argon2]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
