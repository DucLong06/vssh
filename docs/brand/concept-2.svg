    <path d="M200 102 L256 68 L312 102" stroke-width="36"/>
    <path d="M124 160 L256 340 L388 160" stroke-width="68"/>
  </g>
  <circle cx="256" cy="438" r="30" fill="#16161e"/>
</svg>
